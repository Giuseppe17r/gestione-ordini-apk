name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential zip unzip openjdk-11-jdk python3-pip libffi-dev libssl-dev zlib1g-dev libncurses5
        pip install --upgrade Cython virtualenv buildozer

    - name: Compile APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v2
      with:
        name: gestione-ordini-apk
        path: ./bin/*.apk
